name: Tests des règles

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    env:
      GODOT_VERSION: "4.6"
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - name: Installer Godot
        run: |
          curl -sSL -o godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q godot.zip
          mv "Godot_v${GODOT_VERSION}-stable_linux.x86_64" godot
      - name: Importer le projet
        run: ./godot --headless --path . --import
      - name: Lancer les tests
        shell: bash
        run: |
          ./godot --headless --path . -s tests/run_tests.gd 2>&1 | tee resultats.txt
          # Une erreur de script interrompt un test sans le compter en échec : on la refuse ici.
          ! grep -q "SCRIPT ERROR" resultats.txt
